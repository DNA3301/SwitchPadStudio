name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Unit and Tk interface tests (no driver required)
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q main.py switchpad tools tests
      - name: Build Windows EXE without driver installation
        shell: powershell
        run: ./setup_windows.ps1 -BuildExe -NoLaunch
      - name: Verify packaged GUI and SDL identity bridge
        shell: powershell
        run: |
          $check = Start-Process -WindowStyle Hidden -FilePath './SwitchPadStudio.exe' -ArgumentList '--verify-install build/ci-verification.json' -PassThru -Wait
          if ($check.ExitCode -ne 0) { throw 'EXE verification process failed' }
          $result = Get-Content -Raw build/ci-verification.json | ConvertFrom-Json
          if (-not $result.pass) { throw 'EXE GUI/SDL verification failed' }
